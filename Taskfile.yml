version: '3'

env:
  GOWORK: 'off'

tasks:
  default:
    desc: 'Default task runs the "test" and "build" tasks'
    deps:
      - test
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

###############################################################################

  go-tidy:
    desc: 'Go tidy all the things'
    cmds:
      - go mod tidy
      - go -C examples mod tidy

  go-update:
    desc: 'Go update all the dependencies'
    cmds:
      - go get -u ./...
      - go -C examples get -u ./...
      - go -C examples get -u tool
      - task: go-tidy

  test:
    desc: 'Run the tests and the scripts'
    cmds:
      - go test -mod=readonly ./...
      - go -C examples test -mod=readonly ./...

  test-race:
    desc: 'Run the tests with the race detector'
    cmds:
      - go test -mod=readonly -race ./...
      - go -C examples test -mod=readonly -race ./...

  screens:
    desc: 'Rewrite the golden screens of the scripts, then read the diff'
    cmds:
      - go test -mod=readonly ./... -update-screens

  bench:
    desc: 'Time typing and drawing in a folder of 100,000 files'
    cmds:
      - go test -mod=readonly -run '^$' -bench . .

  vet:
    desc: 'Run go vet'
    cmds:
      - go vet -mod=readonly ./...
      - go -C examples vet -mod=readonly ./...

  build:
    desc: 'Build the examples into bin/'
    cmds:
      - go -C examples build -mod=readonly -o ../bin/pick ./pick
      - go -C examples build -mod=readonly -o ../bin/pathpick ./pathpick
      - go -C examples build -mod=readonly -o ../bin/demo ./demo
    sources:
      - '*.go'
      - internal/memfs/*.go
      - examples/**/*.go
      - examples/go.mod
      - examples/go.sum
      - go.mod
      - go.sum
    generates:
      - bin/pick
      - bin/pathpick
      - bin/demo

  demo:
    desc: 'Run the demo over a pretend home folder (-- -layout columns)'
    interactive: true
    cmds: ['go -C examples run ./demo {{.CLI_ARGS}}']

  clean:
    desc: 'Remove built programs, recordings, and generated site files'
    deps:
      - clean-wasm-site
    cmds:
      - rm -rf bin dist .task

###############################################################################
# Playing with it

  play:
    desc: Try the chooser over an in-memory tree (-- -from ~/Downloads, -script FILE, -option layout=columns)
    interactive: true
    cmds: ['go run ./internal/cmd/play {{.CLI_ARGS}}']

  record:
    desc: Play with the chooser and keep what you do as a test script (NAME=mything)
    interactive: true
    requires:
      vars: [NAME]
    preconditions:
      - sh: test ! -e testdata/scripts/{{.NAME}}.txt
        msg: "testdata/scripts/{{.NAME}}.txt exists: pick another NAME"
    cmds:
      - go run ./internal/cmd/play -record testdata/scripts/{{.NAME}}.txt {{.CLI_ARGS}}
      - go test -mod=readonly . -run 'TestScripts/{{.NAME}}$' -update-screens
      - echo "Written testdata/scripts/{{.NAME}}.txt and its .golden; read both, add checks, then task test"

  replay:
    desc: Step through a script in the terminal, its checks shown (SCRIPT=columns)
    interactive: true
    requires:
      vars: [SCRIPT]
    cmds: ['go run ./internal/cmd/play -replay -script testdata/scripts/{{.SCRIPT}}.txt {{.CLI_ARGS}}']

###############################################################################
# Recordings

  tape:
    desc: Write a script as a VHS tape in dist (SCRIPT=columns)
    requires:
      vars: [SCRIPT]
    vars:
      CMD: '{{.CMD | default "pick ."}}'
      KEYS: '{{.KEYS | default "alt+up=Ctrl+Up,alt+left=Ctrl+O"}}'
      PAUSE: '{{.PAUSE | default "500ms"}}'
    cmds:
      - mkdir -p dist
      - >-
        go run ./internal/pickertest/tape
        -cmd "{{.CMD}}" -keys "{{.KEYS}}" -pause "{{.PAUSE}}"
        -o "dist/{{.SCRIPT}}.gif"
        testdata/scripts/{{.SCRIPT}}.txt > dist/{{.SCRIPT}}.tape

  gif:
    desc: Record a script as a GIF in dist (SCRIPT=columns; needs vhs)
    requires:
      vars: [SCRIPT]
    preconditions:
      - sh: command -v vhs
        msg: "vhs is not installed (brew install vhs): it records the GIF"
    cmds:
      - task: tape
        vars: {SCRIPT: '{{.SCRIPT}}', CMD: '{{.CMD}}', KEYS: '{{.KEYS}}', PAUSE: '{{.PAUSE}}'}
      # The tape types pick, so the one just built is first on the path.
      - task: build
      - PATH="$PWD/bin:$PATH" vhs dist/{{.SCRIPT}}.tape

  gifs:
    desc: Record the showcase scripts as GIFs in dist (needs vhs)
    vars:
      SCRIPTS: '{{.SCRIPTS | default "columns places filter complete2"}}'
    cmds:
      - for: {var: SCRIPTS, split: ' '}
        task: gif
        vars: {SCRIPT: '{{.ITEM}}'}

###############################################################################
# Demo website via booba

  build-wasm:
    desc: 'Build the browser demo into web/demos/'
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p web/demos
      - go -C examples build -mod=readonly -o ../web/demos/demo.wasm ./demo

  build-wasm-site:
    desc: 'Build the WASM demo site into web/ and export the pinned booba runtime'
    cmds:
      - task: build-wasm
      - go -C examples tool booba-assets --no-index ../web/
      - cp LICENSE.txt web/LICENSE
      - cp THIRD_PARTY_NOTICES.md web/

  check-site:
    desc: 'Check site script syntax, required assets, and the demo under Node'
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
      - node scripts/smoke-demo.mjs

  serve-wasm-site:
    desc: 'Serve web/ at http://localhost:8000/ntfilepicker/ (matches GH Pages prefix)'
    deps:
      - build-wasm-site
    vars:
      SERVE_DIR: /tmp/ntfilepicker-site
    cmds:
      - mkdir -p "{{.SERVE_DIR}}"
      - ln -sfn "$PWD/web" "{{.SERVE_DIR}}/ntfilepicker"
      - python3 -m http.server 8000 --directory "{{.SERVE_DIR}}"

  clean-wasm-site:
    desc: 'Remove generated WASM demo site artifacts'
    cmds:
      - rm -rf web/booba web/ghostty-web web/demos
      - rm -f web/wasm_exec.js web/LICENSE web/THIRD_PARTY_NOTICES.md

###############################################################################
# Dependency notices and verification

  notices:
    desc: 'Regenerate notices for native and WASM demo dependencies'
    cmds:
      - go run ./internal/tools/notices > THIRD_PARTY_NOTICES.md

  notices-check:
    desc: 'Verify that dependency notices are current'
    cmds:
      - go run ./internal/tools/notices | cmp -s - THIRD_PARTY_NOTICES.md

  vuln:
    desc: 'Scan dependencies for known vulnerabilities (requires network)'
    vars:
      GOVULNCHECK_VERSION: v1.8.0
    cmds:
      # Build a host executable first: setting GOOS=js during go install
      # would build the scanner itself for WASM instead of scanning WASM code.
      - GOWORK=off GOOS= GOARCH= GOBIN="$PWD/.task/bin" go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
      - GOWORK=off .task/bin/govulncheck -test ./...
      - cd examples && GOWORK=off ../.task/bin/govulncheck -test ./...
      - GOWORK="$PWD/wasm.work" GOOS=js GOARCH=wasm .task/bin/govulncheck ./examples/...

  ci:
    desc: 'Check formatting, dependencies, tests, builds, and known vulnerabilities'
    cmds:
      - test -z "$(gofmt -l .)"
      - go mod tidy -diff
      - go -C examples mod tidy -diff
      - go mod verify
      - go -C examples mod verify
      - task: test-race
      - task: vet
      - GOOS=windows GOARCH=amd64 go build -mod=readonly -o /dev/null ./...
      - GOOS=windows GOARCH=amd64 go -C examples build -mod=readonly -o /dev/null ./...
      - task: build
      - task: build-wasm-site
      - task: check-site
      - task: notices-check
      - task: vuln
